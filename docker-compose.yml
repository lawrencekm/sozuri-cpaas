version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: cpaas_postgres
    restart: unless-stopped
    environment:
      # These can be overridden in a local .env file or in your shell env
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sozuri_db}
    ports:
      - "5432:5432"  # <host_port>:<container_port>
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
